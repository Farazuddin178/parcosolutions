name: Deploy to GitHub Pages

# Builds the static site and publishes it to GitHub Pages.
# - Runs on every push to main, on demand, and once a day so new
#   WordPress posts appear without a code change.
# - Until a custom domain is connected the site lives at
#   https://farazuddin178.github.io/parcosolutions/
# - To switch to your own domain: Settings > Secrets and variables > Actions >
#   Variables > add CUSTOM_DOMAIN = parcosolutions.in, then re-run this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *" # daily, 06:00 IST
  repository_dispatch:
    types: [wordpress-update]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WP_URL: ${{ vars.WP_URL || 'https://parcosolutions.in' }}
      NEXT_PUBLIC_WP_URL: ${{ vars.WP_URL || 'https://parcosolutions.in' }}
      NEXT_PUBLIC_CF7_FORM_ID: ${{ vars.CF7_FORM_ID || '1253' }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Choose base path
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
          fi

      - run: npm ci
      - run: npm run build

      - name: Add CNAME for custom domain
        if: env.CUSTOM_DOMAIN != ''
        run: echo "$CUSTOM_DOMAIN" > out/CNAME

      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
